[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # zip < 9: extraction (`ZipArchive::extract`, `ZipStreamReader::extract`)
    # follows symlinks and keeps SUID bits. Only imprenta-xlsx pulls zip 7, and
    # it only writes workbooks, never extracts one. Drop these once imprenta
    # releases on zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip 7 via imprenta-xlsx only writes archives" },
    { id = "RUSTSEC-2026-0368", reason = "zip 7 via imprenta-xlsx only writes archives" },
    { id = "RUSTSEC-2026-0369", reason = "zip 7 via imprenta-xlsx only writes archives" },
]
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The report engine, not on crates.io yet.
allow-git = ["https://github.com/imprenta-project/imprenta"]
